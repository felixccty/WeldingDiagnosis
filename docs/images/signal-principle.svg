<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 380" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>3σ 判异原理</title>
  <desc>信号曲线与均值上下三倍标准差容差带的对比示意，越界点判为异常。</desc>

  <text x="40" y="30" font-size="16" font-weight="500" fill="#2C2C2A">3σ 判异原理</text>

  <rect x="60" y="60" width="420" height="250" fill="#ffffff" stroke="#D3D1C7" stroke-width="0.5"/>
  <rect x="60" y="112" width="420" height="120" fill="#E1F5EE"/>
  <line x1="60" y1="112" x2="480" y2="112" stroke="#1D9E75" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="60" y1="232" x2="480" y2="232" stroke="#1D9E75" stroke-width="1" stroke-dasharray="5 4"/>
  <line x1="60" y1="172" x2="480" y2="172" stroke="#378ADD" stroke-width="1.5"/>

  <polyline points="62,168 82,160 102,176 122,150 142,182 162,158 182,170 202,140 222,186 242,164 262,158 282,178 302,152 322,170 342,96 362,180 382,160 402,172 422,150 442,178 462,162 478,168" fill="none" stroke="#5F5E5A" stroke-width="2" stroke-linejoin="round"/>
  <circle cx="342" cy="96" r="5" fill="#E24B4A"/>

  <text x="66" y="106" font-size="11" fill="#0F6E56">上限 μ + 3σ</text>
  <text x="66" y="168" font-size="11" fill="#185FA5">均值 μ</text>
  <text x="66" y="228" font-size="11" fill="#0F6E56">下限 μ − 3σ</text>
  <text x="66" y="84" font-size="11" fill="#A32D2D">▲ 越界 → 判异</text>
  <text x="62" y="298" font-size="11" fill="#888780">采样点 / 时间</text>
  <text x="70" y="72" font-size="11" fill="#888780">信号强度</text>

  <rect x="510" y="60" width="130" height="250" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="524" y="84" font-size="12" font-weight="500" fill="#2C2C2A">图例</text>
  <rect x="524" y="98" width="18" height="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="550" y="108" font-size="11" fill="#2C2C2A" dominant-baseline="central">合格容差带</text>
  <line x1="524" y1="132" x2="542" y2="132" stroke="#378ADD" stroke-width="1.5"/>
  <text x="550" y="132" font-size="11" fill="#2C2C2A" dominant-baseline="central">逐点均值 μ</text>
  <line x1="524" y1="160" x2="542" y2="160" stroke="#5F5E5A" stroke-width="2"/>
  <text x="550" y="160" font-size="11" fill="#2C2C2A" dominant-baseline="central">实时信号</text>
  <circle cx="533" cy="188" r="4" fill="#E24B4A"/>
  <text x="550" y="188" font-size="11" fill="#2C2C2A" dominant-baseline="central">越界异常点</text>

  <text x="524" y="224" font-size="11" fill="#5F5E5A">μ = (1/n) Σ x</text>
  <text x="524" y="244" font-size="11" fill="#5F5E5A">σ = √(Σ(μ−x)²/n)</text>
  <text x="524" y="268" font-size="11" fill="#5F5E5A">区间 = [μ−3σ, μ+3σ]</text>
  <text x="524" y="296" font-size="11" fill="#A32D2D">带内合格</text>
  <text x="524" y="312" font-size="11" fill="#A32D2D">越界判异</text>
</svg>
