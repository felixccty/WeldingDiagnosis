<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 415" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>系统架构</title>
  <desc>WeldingDiagnosis 分为外部接口层、界面层、业务层与采集驱动层，数据自下而上流动。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="16" font-weight="500" fill="#2C2C2A">系统架构</text>

  <rect x="40" y="52" width="600" height="68" rx="10" fill="#E6F1FB" stroke="#85B7EB" stroke-width="0.5"/>
  <text x="48" y="90" font-size="12" fill="#185FA5" dominant-baseline="central">外部接口层</text>
  <rect x="150" y="64" width="225" height="44" rx="8" fill="#ffffff" stroke="#378ADD" stroke-width="0.5"/>
  <text x="262" y="86" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">Windows 命名事件</text>
  <rect x="390" y="64" width="230" height="44" rx="8" fill="#ffffff" stroke="#378ADD" stroke-width="0.5"/>
  <text x="505" y="86" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">TCP Server :12345</text>

  <line x1="340" y1="120" x2="340" y2="134" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="136" width="600" height="68" rx="10" fill="#E1F5EE" stroke="#5DCAA5" stroke-width="0.5"/>
  <text x="48" y="174" font-size="12" fill="#0F6E56" dominant-baseline="central">界面层</text>
  <rect x="150" y="148" width="112" height="44" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="206" y="170" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">图表 QChart</text>
  <rect x="270" y="148" width="112" height="44" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="326" y="170" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">模型/样本表</text>
  <rect x="390" y="148" width="112" height="44" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="446" y="170" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">状态指示灯</text>
  <rect x="510" y="148" width="112" height="44" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="566" y="170" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">模式切换</text>

  <line x1="340" y1="204" x2="340" y2="218" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="220" width="600" height="88" rx="10" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="0.5"/>
  <text x="48" y="264" font-size="12" fill="#534AB7" dominant-baseline="central">业务层</text>
  <rect x="150" y="232" width="220" height="56" rx="8" fill="#ffffff" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="260" y="251" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">WeldingDiagnosis</text>
  <text x="260" y="270" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">主窗口 · 状态机 · 统计</text>
  <rect x="382" y="232" width="118" height="56" rx="8" fill="#ffffff" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="441" y="251" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">thread_obj</text>
  <text x="441" y="270" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">学习采样线程</text>
  <rect x="512" y="232" width="118" height="56" rx="8" fill="#ffffff" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="571" y="251" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">thread_ctl</text>
  <text x="571" y="270" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">控制线程</text>

  <line x1="340" y1="308" x2="340" y2="322" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="324" width="600" height="68" rx="10" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="0.5"/>
  <text x="48" y="362" font-size="12" fill="#5F5E5A" dominant-baseline="central">采集驱动层</text>
  <rect x="150" y="336" width="225" height="44" rx="8" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="262" y="358" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">USB9825 API (SDK)</text>
  <rect x="390" y="336" width="230" height="44" rx="8" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="505" y="358" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">采集卡 hDevice · AD 采样</text>
</svg>
