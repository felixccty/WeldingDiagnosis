<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 470" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>检测模式流程</title>
  <desc>检测模式下从配置连续采集、定时器刷新曲线到停止采集的流程。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="16" font-weight="500" fill="#2C2C2A">检测模式流程</text>

  <rect x="230" y="50" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="72" font-size="13" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">点击「开始检测」</text>
  <line x1="340" y1="94" x2="340" y2="112" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="114" width="300" height="56" rx="8" fill="#ffffff" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="133" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">start_collect() 配置连续采集</text>
  <text x="340" y="152" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">TRIG_MODE_CONTINUE · 长度 1024</text>
  <line x1="340" y1="170" x2="340" y2="188" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="190" width="300" height="56" rx="8" fill="#ffffff" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="209" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">启动 1 ms QTimer</text>
  <text x="340" y="228" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">timeout → curr_signal_thread()</text>
  <line x1="340" y1="246" x2="340" y2="264" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="266" width="300" height="56" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="285" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">读取 AD，取首点 inBuffer[0]</text>
  <text x="340" y="304" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">更新滚动窗口 diag_signal（200 点）</text>
  <line x1="340" y1="322" x2="340" y2="340" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="190" y="342" width="300" height="56" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="361" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">seriesD-&gt;replace() 刷新曲线</text>
  <text x="340" y="380" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">Y 轴范围自适应 · processEvents()</text>

  <path d="M490 370 L530 370" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="490" y="342" width="150" height="56" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="565" y="361" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">循环刷新</text>
  <text x="565" y="380" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">直至停止</text>
  <path d="M565 342 L565 220 L490 220" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>

  <line x1="340" y1="398" x2="340" y2="416" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="230" y="418" width="220" height="44" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="440" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">stop_collect() → StopAD</text>
</svg>
