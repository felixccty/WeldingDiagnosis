<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <title>学习模式流程</title>
  <desc>从触发、采集、统计到落盘的学习模式完整流程，含分支判断。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="40" y="30" font-size="16" font-weight="500" fill="#2C2C2A">学习模式流程</text>

  <rect x="230" y="50" width="220" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="72" font-size="13" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">触发：UI / 事件 / TCP</text>
  <line x1="340" y1="94" x2="340" y2="112" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="114" width="280" height="56" rx="8" fill="#ffffff" stroke="#378ADD" stroke-width="0.5"/>
  <text x="340" y="133" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">start_learn() 配置采集参数</text>
  <text x="340" y="152" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">PWM 100 Hz · 后触发 · 256 点/帧</text>
  <line x1="340" y1="170" x2="340" y2="188" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="200" y="190" width="280" height="56" rx="8" fill="#ffffff" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="209" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">learning_thread() 循环采样</text>
  <text x="340" y="228" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">signal_H(int) → 实时显示曲线</text>
  <line x1="340" y1="246" x2="340" y2="264" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M340 266 L300 288" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="228" y="290" width="144" height="44" rx="8" fill="#FAEEDA" stroke="#BA7517" stroke-width="0.5"/>
  <text x="300" y="312" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">继续采样？</text>
  <path d="M372 288 L408 288" fill="none" stroke="#888780" stroke-width="1.5"/>
  <rect x="410" y="266" width="190" height="44" rx="8" fill="#ffffff" stroke="#888780" stroke-width="0.5"/>
  <text x="505" y="288" font-size="12" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">停止采样 do_analysize</text>

  <path d="M300 334 L300 356" fill="none" stroke="#BA7517" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="312" y="348" font-size="11" fill="#854F0B">是</text>
  <path d="M228 312 L170 312 L170 132 L200 132" fill="none" stroke="#BA7517" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="176" y="226" font-size="11" fill="#854F0B">否 · 下一帧</text>

  <rect x="200" y="358" width="280" height="56" rx="8" fill="#ffffff" stroke="#7F77DD" stroke-width="0.5"/>
  <text x="340" y="377" font-size="13" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">learning_data_analysis()</text>
  <text x="340" y="396" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">逐点计算 μ 与 σ → μ ± 3σ</text>
  <line x1="505" y1="310" x2="505" y2="386" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <line x1="340" y1="414" x2="340" y2="432" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <rect x="200" y="434" width="280" height="48" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text x="340" y="450" font-size="12" font-weight="500" fill="#2C2C2A" text-anchor="middle" dominant-baseline="central">更新容差带与样本表</text>
  <text x="340" y="468" font-size="11" fill="#5F5E5A" text-anchor="middle" dominant-baseline="central">写入 test.csv / test_result.csv</text>
</svg>
